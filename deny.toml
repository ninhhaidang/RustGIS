# cargo-deny: the licences RustGIS accepts in its dependencies (`cargo deny check licenses`, run
# by CI). Keep this in step with `accepted` in about.toml, which writes the third-party notices.

[graph]
all-features = false
exclude-dev = false

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# RustGIS's own apps and xtask (`publish = false`).
ignore = true

# Dependencies currently come only from crates.io. An intentional git or registry source must
# be reviewed here too; git sources must name a revision rather than follow a branch or tag.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
