name: CI on label

# A pull request labelled `ci:macos`, `ci:windows` or `ci:full` is tested on that platform (both for
# `ci:full`) as soon as the label is added; CI and the Python package workflow test it there on
# later pushes.
# Its own workflow, so a label's run doesn't stand in for the pull request's CI run.

on:
  pull_request:
    types: [labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  cancel:
    name: Cancel label CI
    if: github.event.action == 'unlabeled' && startsWith(github.event.label.name, 'ci:')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Label removed; previous CI run cancelled."

  plan:
    name: Platforms
    if: github.event.action == 'labeled' && startsWith(github.event.label.name, 'ci:')
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - id: os
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: echo "os=$(.github/scripts/platforms.sh)" >> "$GITHUB_OUTPUT"

  rust:
    needs: plan
    if: needs.plan.outputs.os != '[]'
    uses: ./.github/workflows/test-rust.yml
    with:
      os: ${{ needs.plan.outputs.os }}
      release-build: ${{ github.event.label.name == 'ci:full' }}

  python:
    needs: plan
    if: needs.plan.outputs.os != '[]'
    uses: ./.github/workflows/test-python.yml
    with:
      os: ${{ needs.plan.outputs.os }}
