name: Release

on:
  release:
    types: [published]
  # Build-only trial run, started by the Release dry run workflow (or by hand)
  # before a tag is cut. Uploads to the GitHub Release are gated on the
  # `release` event, so it builds the same packages and keeps them as workflow
  # artifacts only.
  workflow_dispatch:

# Read-only by default; only the release-only publish job can write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
          - name: Linux arm64
            os: ubuntu-22.04-arm
          - name: Windows x64
            os: windows-latest
          # Snapdragon and other ARM64 PCs (#1143): native, not under x64 emulation. Built for
          # its target by name: Git Bash on this runner says x86_64, so package.sh would name
          # (and mark) the packages x64 from `uname -m`.
          - name: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: macOS Apple Silicon
            os: macos-latest
          - name: macOS Intel
            os: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Version
        id: version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The version in [workspace.package]. A pre-release tag (v0.2.0-rc.1) needs the same
          # pre-release version in Cargo.toml.
          crate="$(awk '/^\[/ { s = ($0 == "[workspace.package]") } s && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }' Cargo.toml)"
          version="${TAG:-$crate}"
          version="${version#v}"
          # A tag must match the workspace version, so the app reports what was released.
          if [ -n "$TAG" ] && [ "$version" != "$crate" ]; then
            echo "::error::Tag $TAG does not match the workspace version $crate in Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p rustgis -p rustgis-cli ${TARGET:+--target "$TARGET"}

      - name: Install packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      # The WiX .NET tool (pinned to 5.x, MS-RL) for the .msi; NSIS for setup.exe when the
      # runner image lacks it.
      - name: Install Windows installer tools
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          tools="$HOME/.dotnet/tools"
          "$tools/wix" extension add --global WixToolset.UI.wixext/5.0.2
          cygpath -w "$tools" >> "$GITHUB_PATH"
          # The Chocolatey feed times out now and then (504) and choco still exits 0, so retry
          # and fail here, not later in package.sh with "makensis not found".
          nsis="/c/Program Files (x86)/NSIS/makensis.exe"
          for attempt in 1 2 3 4 5; do
            command -v makensis > /dev/null || [ -x "$nsis" ] && break
            [ "$attempt" -gt 1 ] && sleep $((attempt * 20))
            choco install nsis -y --no-progress || true
          done
          command -v makensis > /dev/null || [ -x "$nsis" ] || { echo "::error::NSIS did not install"; exit 1; }

      # macOS: import the Developer ID certificate into a throwaway keychain and write the
      # App Store Connect API key for notarization. Skipped when the secrets are absent (a
      # fork), so package.sh falls back to an ad-hoc signature.
      - name: Set up macOS signing
        id: macsign
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "::warning::No Apple signing secrets: the macOS build is ad-hoc signed and not notarized."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pw="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_pw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pw" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_pw" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "identity=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_API_KEY" ]; then
            printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
            echo "api_key_path=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No APPLE_API_KEY secret: the macOS build is signed but not notarized."
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MACOS_SIGN_IDENTITY: ${{ steps.macsign.outputs.identity }}
          APPLE_API_KEY_PATH: ${{ steps.macsign.outputs.api_key_path }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          TARGET: ${{ matrix.target }}
        run: |
          packaging/package.sh "$VERSION" "$TARGET"
          # A build for a named target is packaged under its architecture, not the shell's.
          if [ -n "$TARGET" ]; then
            arch="${TARGET%%-*}"
            ls dist | grep -q -- "-$arch" || { ls dist; echo "::error::No $arch packages in dist/"; exit 1; }
            if [ "$arch" != x86_64 ] && ls dist | grep -q -- "-x86_64"; then
              ls dist; echo "::error::x86_64 packages from a $TARGET build"; exit 1
            fi
          fi

      - name: Verify macOS signature
        if: runner.os == 'macOS' && steps.macsign.outputs.identity != ''
        shell: bash
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/RustGIS.app"
          # stapler validate looks the ticket up in Apple's CloudKit, which drops connections now
          # and then ("The network connection was lost", error 68): retry before failing.
          validate() {
            for attempt in 1 2 3 4 5; do
              xcrun stapler validate "$1" && return 0
              [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
            done
            return 1
          }
          if [ -n "${{ steps.macsign.outputs.api_key_path }}" ]; then
            spctl --assess --type execute --verbose=2 "$RUNNER_TEMP/dmg/RustGIS.app"
            validate "$RUNNER_TEMP/dmg/RustGIS.app"
            # package.sh stapled the DMG and stapling validates the ticket it attaches, so ask
            # Gatekeeper here: it reads the stapled ticket locally, as a user's Mac does, instead
            # of another CloudKit lookup that the Intel runners keep losing.
            spctl --assess --type open --context context:primary-signature --verbose=2 dist/*.dmg
          fi
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Remove signing material
        if: always() && runner.os == 'macOS' && steps.macsign.outputs.identity != ''
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      # Silent installs of both installers: the CLI runs from the install folder and is on the
      # PATH; uninstalling removes it again.
      - name: Check the Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Check($dir, $scope) {
            & "$dir\rustgis-cli.exe" logo "$env:RUNNER_TEMP\logo.png" --size 64
            if ($LASTEXITCODE) { throw "rustgis-cli failed in $dir" }
            if (-not (Test-Path "$dir\THIRD-PARTY-LICENSES.txt")) { throw "no THIRD-PARTY-LICENSES.txt in $dir" }
            $path = [Environment]::GetEnvironmentVariable('Path', $scope) -split ';'
            if ($path -notcontains $dir.TrimEnd('\') -and $path -notcontains "$($dir.TrimEnd('\'))\") {
              throw "$dir is not on the $scope PATH"
            }
          }
          function Gone($dir, $scope) {
            if (Test-Path "$dir\rustgis.exe") { throw "$dir\rustgis.exe is still there" }
            $path = [Environment]::GetEnvironmentVariable('Path', $scope)
            if ($path -and $path.Contains($dir.TrimEnd('\'))) { throw "$dir is still on the $scope PATH" }
          }

          $msi = (Get-Item dist\*.msi).FullName
          $log = "$env:RUNNER_TEMP\msi.log"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode) { Get-Content $log -Tail 80; throw "msiexec /i exited with $($p.ExitCode)" }
          $dir = "$env:ProgramFiles\RustGIS"
          Check $dir 'Machine'
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\RustGIS.lnk")) {
            throw 'no Start menu shortcut'
          }
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode) { throw "msiexec /x exited with $($p.ExitCode)" }
          Gone $dir 'Machine'

          $setup = (Get-Item dist\*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\RustGIS"
          Check $dir 'User'
          if ((Get-ItemProperty 'HKCU:\Software\Classes\.rgis').'(default)' -ne 'RustGIS.Project') {
            throw '.rgis is not associated'
          }
          # _?= keeps the uninstaller in place, so -Wait waits for it.
          Start-Process "$dir\uninstall.exe" -ArgumentList '/S', "_?=$dir" -Wait
          Gone $dir 'User'

      - name: Check the .deb installs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./dist/rustgis_*.deb
          dpkg-deb -f dist/rustgis_*.deb Depends
          rustgis-cli logo "$RUNNER_TEMP/logo.png" --size 64
          test -s /usr/share/doc/rustgis/THIRD-PARTY-LICENSES.txt

      - name: Check the .rpm installs on Fedora
        if: runner.os == 'Linux'
        run: |
          rpm -qp --requires dist/rustgis-*.rpm
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest sh -c \
            'dnf install -y -q /dist/rustgis-*.rpm && rustgis-cli logo /tmp/logo.png --size 64'

      - name: Check the AppImage runs
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/*.AppImage
          cd "$RUNNER_TEMP" && rm -rf squashfs-root
          "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-extract > /dev/null
          squashfs-root/usr/bin/rustgis-cli logo logo.png --size 64
          test -x squashfs-root/AppRun
          # The embedded update information points at the .zsync published beside it.
          "$GITHUB_WORKSPACE"/dist/*.AppImage --appimage-updateinformation | tee update.txt
          grep -q "^gh-releases-zsync|.*|latest|RustGIS-\*-linux-$(uname -m).AppImage.zsync$" update.txt
          test -s "$GITHUB_WORKSPACE"/dist/*.AppImage.zsync
          # The GUI cannot start on a headless runner: check that its libraries resolve.
          if ldd squashfs-root/usr/bin/rustgis | grep 'not found'; then exit 1; fi
          rm -rf squashfs-root

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustgis-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Trunk
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin" trunk
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the static app
        working-directory: apps/rustgis-web
        run: trunk build --release --locked --public-url ./
      - name: Add the service worker
        run: cargo xtask web-pwa dist/web
      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          crate="$(awk '/^\[/ { s = ($0 == "[workspace.package]") } s && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }' Cargo.toml)"
          version="${TAG:-$crate}"
          version="${version#v}"
          if [ "$version" != "$crate" ]; then
            echo "::error::Release tag does not match workspace version $crate."
            exit 1
          fi
          (cd dist/web && zip -r "../RustGIS-$version-web.zip" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustgis-web
          path: dist/RustGIS-*-web.zip
          if-no-files-found: error

  # The packages ship THIRD-PARTY-LICENSES.txt as committed: it must match Cargo.lock and the
  # code and data from other projects listed in xtask/src/notices.rs.
  notices:
    name: Third-party notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-about@0.9.2
      - name: The notices are up to date
        run: cargo xtask notices --check

  checksums:
    name: Checksums
    needs: [build, web, notices]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rustgis-sha256sums
          path: dist/SHA256SUMS

  publish:
    name: Attach to GitHub Release
    if: github.event_name == 'release'
    needs: checksums
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
