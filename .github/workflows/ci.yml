name: CI

# macOS and Windows are slow: pushes to main test on every platform, pull requests on Linux, plus
# macOS when labelled `ci:macos`, Windows (x64 and ARM64) when labelled `ci:windows`, and both for
# `ci:full`. A manual run tests on every platform, or on Linux alone when asked (a fork checking a
# branch before its pull request runs the pull request's own checks).
# Adding the label runs that platform straight away (ci-label.yml); later pushes include it here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to test on
        type: choice
        options: [all, linux]
        default: all

# A pull request's runs are grouped by its number, not by github.ref: a run GitHub creates after
# the pull request has merged gets the base branch's ref (refs/heads/main), and would otherwise
# join main's group and cancel main's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main saves the cache (see test-rust.yml).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  wasm:
    name: Web app (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main saves the cache (see test-rust.yml).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build for the browser
        run: cargo build --locked --target wasm32-unknown-unknown -p rustgis-web

  # The iOS app (apps/rustgis-mobile, #1902): linted for devices and built for the Simulator,
  # where macOS is tested (pushes to main, a manual run on every platform, a pull request labelled
  # `ci:macos` or `ci:full`). Unlike the tests, it runs from the next push after the label is
  # added, not straight away (ci-label.yml runs test-rust.yml only).
  ios:
    name: iOS app
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'linux')
      || contains(github.event.pull_request.labels.*.name, 'ci:macos')
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main saves the cache (see test-rust.yml).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint the app for devices
        run: cargo clippy --locked --target aarch64-apple-ios -p rustgis-mobile --all-targets
      - name: Build the app for the Simulator
        run: apps/rustgis-mobile/build-ios.sh --debug simulator

  # Every dependency's licence must be one the project accepts (deny.toml). The third-party
  # notices the packages ship (`cargo xtask notices`) only warn here when out of date, since
  # Dependabot can't regenerate them; the release build requires them current.
  licenses:
    name: Licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main saves the cache (see test-rust.yml).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny,cargo-about@0.9.2
      - name: Cargo source replacements
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          python3 .github/scripts/check-cargo-sources.py
      - name: Dependency licences and sources
        run: cargo deny --locked check licenses sources
      - name: Third-party notices
        # Exit code 2 is stale notices (a warning); anything else (cargo-about failing, a licence
        # it can't work out) fails the job.
        run: |
          status=0
          cargo xtask notices --check || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::warning::THIRD-PARTY-LICENSES.txt is out of date: run cargo xtask notices and commit it before the next release."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

  schema:
    name: Project schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # `cargo xtask schema --check` lints the code behind the `schema` feature first.
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Only main saves the cache (see test-rust.yml).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The committed schema matches the types the project is saved from, and the fixture projects
      # open. `--locked` on the outer run too, so a stale Cargo.lock is refused before xtask starts.
      - name: Check the project file's schema
        run: cargo run --locked -q -p xtask -- schema --check
      # Every fixture, not only those the pull request changes (as pre-commit does), so a change
      # to the schema alone is checked against them too.
      - name: Validate the fixture projects against the schema
        run: pipx run check-jsonschema==0.39.0 --schemafile schema/project.schema.json --default-filetype json schema/fixtures/*.rgis

  plan:
    name: Platforms
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.os.outputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/scripts
      - id: os
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PLATFORMS: ${{ inputs.platforms }}
        run: echo "os=$(.github/scripts/platforms.sh)" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    uses: ./.github/workflows/test-rust.yml
    with:
      os: ${{ needs.plan.outputs.os }}
      # The release build runs nightly; `ci:full` asks for it before merging.
      release-build: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
