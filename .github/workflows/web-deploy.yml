# Publishes the browser app to the dedicated opengeos/rustgis-web GitHub Pages repository
# (https://web.rustgis.app) after every update to main. The hosting repository holds only the
# generated site; this workflow stays beside the source it builds.
#
# Required repository secret:
#   WEB_DEPLOY_KEY - private half of an SSH deploy key with write access to opengeos/rustgis-web
name: Deploy web.rustgis.app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Ref to build and publish (branch, tag, or SHA)
        default: main

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    if: github.repository == 'opengeos/RustGIS'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Record the commit that was built
        id: built
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build the web app
        run: |
          set -euo pipefail
          # Pinned Trunk release, checksum-verified, installed outside root-owned directories.
          curl -sSfL -o "$RUNNER_TEMP/trunk.tar.gz" https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin" trunk
          export PATH="$RUNNER_TEMP/bin:$PATH"
          cd apps/rustgis-web
          trunk build --release --public-url /

      - name: Add Google Analytics
        # The measurement ID comes from the RUSTGIS_WEB_GA_MEASUREMENT_ID repository variable (its own
        # GA4 data stream), falling back to RUSTGIS_GA_MEASUREMENT_ID, the docs site's. Only this
        # deploy adds the tag: the desktop app, the CLI, local and fork builds never load it. A value
        # that is not a GA4 measurement ID fails the deploy instead of publishing a tag that reports
        # nowhere.
        working-directory: dist/web
        env:
          RAW_MEASUREMENT_ID: ${{ vars.RUSTGIS_WEB_GA_MEASUREMENT_ID || vars.RUSTGIS_GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          id=$(printf '%s' "${RAW_MEASUREMENT_ID:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:lower:]' '[:upper:]')
          if [ -z "$id" ]; then
            echo "Analytics disabled (no measurement ID configured)."
            exit 0
          fi
          if [[ ! $id =~ ^G-[A-Z0-9]{4,24}$ ]]; then
            echo "::error::RUSTGIS_WEB_GA_MEASUREMENT_ID is not a GA4 measurement ID (G-...)."
            exit 1
          fi
          # The standard Google tag, reporting the page as origin + path: the query string
          # (`?extent=`, `?lang=`, ...) is dropped from the page and referrer, and the automatic
          # page view, which would carry it, is replaced by an explicit one.
          cat > "$RUNNER_TEMP/analytics.html" <<EOF
          <script async src="https://www.googletagmanager.com/gtag/js?id=${id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            (function () {
              var page = { page_location: location.origin + location.pathname };
              try { if (document.referrer) { var r = new URL(document.referrer); page.page_referrer = r.origin + r.pathname; } } catch (e) {}
              gtag('set', page);
              gtag('js', new Date());
              gtag('config', '${id}', Object.assign({ send_page_view: false }, page));
              gtag('event', 'page_view', page);
            })();
          </script>
          EOF
          grep -q '</head>' index.html
          python3 - "$RUNNER_TEMP/analytics.html" <<'PY'
          import pathlib, sys
          tag = pathlib.Path(sys.argv[1]).read_text()
          page = pathlib.Path("index.html")
          page.write_text(page.read_text().replace("</head>", tag + "</head>", 1))
          PY
          echo "Analytics enabled for $id."

      # After every change to index.html: the service worker lists the built files (Trunk names
      # them by content hash) so the installed app starts offline, and its version changes with any
      # of them so a new deploy is picked up.
      - name: Add the service worker
        run: cargo xtask web-pwa dist/web

      - name: Prepare the site for GitHub Pages
        working-directory: dist/web
        run: |
          set -euo pipefail
          test -f index.html
          ls *_bg.wasm >/dev/null
          test -f sw.js && test -f manifest.webmanifest
          touch .nojekyll
          echo "web.rustgis.app" > CNAME
          oversized=$(find . -type f -size +104857600c -print)
          if [ -n "$oversized" ]; then
            echo "::error::A file exceeds GitHub Pages' 100 MB per-file limit: $oversized"
            exit 1
          fi
          echo "Built site: $(du -sh . | cut -f1)"

      - name: Configure the hosting repository deploy key
        env:
          WEB_DEPLOY_KEY: ${{ secrets.WEB_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${WEB_DEPLOY_KEY:-}" ]; then
            echo "::error::WEB_DEPLOY_KEY is not configured."
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$WEB_DEPLOY_KEY" > "$HOME/.ssh/rustgis-web"
          chmod 600 "$HOME/.ssh/rustgis-web"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Publish an orphan snapshot
        working-directory: dist/web
        env:
          BUILT_SHA: ${{ steps.built.outputs.sha }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/rustgis-web -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${BUILT_SHA} from ${GITHUB_REPOSITORY}"
          # Parentless snapshots keep the hosting repository near the size of one build.
          git push -q --force git@github.com:opengeos/rustgis-web.git gh-pages
          echo "Published ${BUILT_SHA} to https://web.rustgis.app"
