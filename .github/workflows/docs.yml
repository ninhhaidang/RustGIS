name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false
      - name: Configure Google Analytics
        # The measurement ID comes from the RUSTGIS_GA_MEASUREMENT_ID repository variable. Unset
        # (forks, local builds, PR previews) ships no tracker; a value that is not a GA4 measurement
        # ID fails the build instead of publishing a tag that reports nowhere.
        env:
          RAW_MEASUREMENT_ID: ${{ vars.RUSTGIS_GA_MEASUREMENT_ID }}
        run: |
          set -euo pipefail
          id=$(printf '%s' "${RAW_MEASUREMENT_ID:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:lower:]' '[:upper:]')
          if [ -z "$id" ]; then
            echo "Analytics disabled (no measurement ID configured)."
            exit 0
          fi
          if [[ ! $id =~ ^G-[A-Z0-9]{4,24}$ ]]; then
            echo "::error::RUSTGIS_GA_MEASUREMENT_ID is not a GA4 measurement ID (G-...)."
            exit 1
          fi
          printf '\n[project.extra.analytics]\nprovider = "google"\nproperty = "%s"\n' "$id" >> zensical.toml
          echo "Analytics enabled for $id."
      - name: Build docs with Zensical
        run: |
          uv venv --python 3.12
          uv pip install -r requirements_docs.txt
          .venv/bin/zensical build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
