# A trial run of everything a release fires, without publishing any of it.
#
# The release workflow only publishes on `release: published`, so a packaging
# break could sit on `main` unnoticed and surface for the first time on the
# release itself, with the tag already cut. Run this before tagging. It checks
# the planned tag against the workspace version, dispatches every release
# workflow that can build without publishing, waits for them all, and fails if
# any of them fails.
#
#   gh workflow run release-dry-run.yml -R opengeos/RustGIS --ref main -f version=0.2.0
#
# Each workflow it triggers withholds its own publishing on a non-release
# event, so nothing here can write a release asset:
#
#   Release - builds the Windows installers, zip and MSIX, macOS DMGs, Linux
#             tarballs, .deb/.rpm packages and AppImages, installs them where
#             it can, builds the static web-app zip, and writes SHA256SUMS;
#             its publish job is skipped
#
# Deliberately not included: Deploy web.rustgis.app publishes on every push to
# `main`, so it is continuously covered, and dispatching it here would publish
# the site for real.
name: Release dry run

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build (not a commit SHA; defaults to the branch this is run from)
        required: false
        default: ""
      version:
        description: Version you plan to tag, e.g. 0.2.0 (checked against Cargo.toml; optional)
        required: false
        default: ""

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dry-run:
    name: Build everything, publish nothing
    runs-on: ubuntu-latest
    # The polling step has its own 90-minute deadline; leave room for the
    # dispatch step and the final status table.
    timeout-minutes: 110
    permissions:
      contents: read
      # Dispatch the release workflows and read back their conclusions.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Check the planned version
        env:
          PLANNED: ${{ inputs.version }}
        run: |
          crate="$(awk '/^\[/ { s = ($0 == "[workspace.package]") } s && /^version *=/ { gsub(/.*= *"|".*/, ""); print; exit }' Cargo.toml)"
          planned="${PLANNED#v}"
          echo "Workspace version: $crate"
          if [ -n "$planned" ] && [ "$planned" != "$crate" ]; then
            echo "::error::Planned version $planned does not match $crate in Cargo.toml. Bump Cargo.toml before tagging v$planned, or the release workflow will refuse the tag."
            exit 1
          fi

      - name: Trigger every release workflow in build-only mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          workflows="release.yml"

          # Record the newest existing run id per workflow first. `gh workflow
          # run` returns nothing identifying, so each new run is found by
          # watching for an id above this watermark rather than by taking "the
          # most recent run", which could pick up an unrelated one.
          : > watermarks.txt
          for wf in $workflows; do
            before="$(gh run list -R "$REPO" --workflow "$wf" --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0')"
            echo "$wf $before" >> watermarks.txt
          done

          for wf in $workflows; do
            gh workflow run "$wf" -R "$REPO" --ref "$REF"
            echo "dispatched $wf"
          done

          # Give the runs time to register before resolving their ids.
          sleep 20

          : > runs.txt
          while read -r wf before; do
            id=""
            for _ in $(seq 1 12); do
              # The oldest run above the watermark is the one just dispatched.
              id="$(gh run list -R "$REPO" --workflow "$wf" --event workflow_dispatch \
                --limit 20 --json databaseId \
                --jq "[.[] | select(.databaseId > $before)] | min_by(.databaseId) | .databaseId // empty")"
              [ -n "$id" ] && break
              sleep 10
            done
            if [ -z "$id" ]; then
              echo "::error::$wf never produced a new run after dispatch"
              exit 1
            fi
            echo "$wf $id" >> runs.txt
            echo "  $wf -> $id"
          done < watermarks.txt
          cp runs.txt "$RUNNER_TEMP/runs.txt"

      - name: Wait for them all and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs="$RUNNER_TEMP/runs.txt"
          # Release builds on five runners; poll for up to 90 minutes.
          deadline=$(( $(date +%s) + 5400 ))
          while :; do
            pending=0
            while read -r wf id; do
              # A transient API failure counts as still running; the next poll retries.
              status="$(gh run view -R "$REPO" "$id" --json status --jq '.status' || echo unknown)"
              [ "$status" = "completed" ] || pending=$((pending + 1))
            done < "$runs"
            [ "$pending" -eq 0 ] && break
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out with $pending workflow(s) still running."
              break
            fi
            sleep 60
          done

          {
            echo "## Release dry run"
            echo
            echo "| Workflow | Result | Run |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          while read -r wf id; do
            meta="$(gh run view -R "$REPO" "$id" --json status,conclusion,workflowName)"
            status="$(jq -r '.status' <<<"$meta")"
            conclusion="$(jq -r '.conclusion // "n/a"' <<<"$meta")"
            name="$(jq -r '.workflowName' <<<"$meta")"
            if [ "$status" != "completed" ]; then
              icon=":hourglass:"; failed=$((failed + 1))
            elif [ "$conclusion" = "success" ]; then
              icon=":white_check_mark:"
            else
              icon=":x:"; failed=$((failed + 1))
            fi
            echo "| $name | $icon $conclusion | [$id](https://github.com/$REPO/actions/runs/$id) |" >> "$GITHUB_STEP_SUMMARY"
          done < "$runs"

          if [ "$failed" -ne 0 ]; then
            echo "::error::$failed release workflow(s) did not succeed. Fix these before tagging."
            exit 1
          fi
          echo "All release workflows built cleanly. Safe to tag."
