[package]
name = "rustgis-geolibre"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L3: the GeoLibre/Whitebox tool suite (1,000+ raster, vector, LiDAR and hydrology tools) as geoprocessing tools, through the optional geolibre runner"

[lints]
workspace = true

[dependencies]
rustgis-geom = { workspace = true }
rustgis-data = { workspace = true }
rustgis-analysis = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
# One-click install of the runner: download the release archive over HTTPS (pure-Rust TLS),
# check its SHA-256 and unpack it. Native only: the browser uses the WASI runner instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
sha2 = { workspace = true }
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
