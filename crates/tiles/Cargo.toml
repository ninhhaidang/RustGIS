[package]
name = "rustgis-tiles"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L2: web map tiles — XYZ/TMS/WMS raster tiles, Mapbox Vector Tiles, a subset of MapLibre styles, and their cache"

[lints]
workspace = true

[dependencies]
rustgis-geom = { workspace = true }
# MBTiles archives are SQLite databases.
rustgis-data = { workspace = true }
serde_json = { workspace = true }
geo = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }
tiny-skia = { workspace = true }
# Tiles are PNG, JPEG or WebP.
image = { workspace = true, features = ["jpeg", "webp"] }
# Vector tiles are sometimes served gzipped without saying so.
miniz_oxide = { workspace = true }
# PMTiles archives may be compressed with Brotli or Zstandard instead of gzip.
brotli-decompressor = { workspace = true }
ruzstd = { workspace = true }
# S3 requests are signed (Signature Version 4) and its listings are XML.
sha2 = { workspace = true }
roxmltree = { workspace = true }
# ArcGIS sign-ins: PKCE challenges and random states.
base64 = { workspace = true }

# Fetching tiles on worker threads. The browser fetches them itself (see `set_fetcher`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
getrandom = "0.4"

[dev-dependencies]
# Tests write Brotli-compressed PMTiles archives.
brotli = { version = "~9.0.0", default-features = false, features = ["std"] }
