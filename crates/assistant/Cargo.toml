[package]
name = "rustgis-assistant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L5: the AI assistant — a chat agent that drives the session through commands, over OpenAI-compatible, OpenAI Responses (a ChatGPT plan), Anthropic and Gemini APIs"

[lints]
workspace = true

[dependencies]
rustgis-engine = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# The PKCE challenge of the ChatGPT sign-in.
sha2 = { workspace = true }
log = { workspace = true }
web-time = { workspace = true }

# Calling the model on the desktop and the command line. The browser calls it with its own fetch
# (the web app's `Services::http`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
# Random bytes for the sign-in's PKCE verifier and state.
getrandom = "0.4"
# Atomic owner-only credential writes on desktop platforms.
tempfile = "3"
# Verifying the sign-in's id token (RS256); already used by rustls.
ring = "0.17"
# Skills added from a .zip archive.
zip = { version = "9", default-features = false, features = ["deflate"] }

# The relay's token folder and file must belong to the user running the process.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }
