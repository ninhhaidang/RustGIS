[package]
name = "rustgis-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L1: feature model, attribute values, vector I/O (GeoJSON, CSV, Shapefile, GeoPackage, GeoParquet, FlatGeobuf, KML/KMZ, GPX), data providers (GeoParquet, FlatGeobuf, GeoPackage) and rasters (GeoTIFF, ASCII grid)"

[lints]
workspace = true

[dependencies]
rustgis-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
csv = { workspace = true }
shapefile = { workspace = true }
encoding_rs = { workspace = true }
# Zstandard, the usual compression of COGs, is C code that compiles to WebAssembly with clang
# (on the CI runners), so the browser decodes it too.
tiff = { workspace = true, features = ["zstd"] }
weezl.workspace = true
proj4rs = { workspace = true }
crs-definitions = { workspace = true }
miniz_oxide = { workspace = true }
roxmltree = { workspace = true }
# zstd, the usual compression of GeoParquet, compiles to WebAssembly like the GeoTIFF one above.
parquet = { workspace = true, features = ["zstd"] }
url = { workspace = true }
bytes = { workspace = true }
flatgeobuf = { workspace = true }
# Polygon union: a multipatch's footprint (File Geodatabase).
geo = { workspace = true }
geozero = { workspace = true }
calamine = { workspace = true }
# LAZ (compressed LiDAR) point clouds.
laz = { workspace = true }
# KML ground overlays are PNG or JPEG pictures.
image = { workspace = true, features = ["jpeg"] }
# Geotagged photos keep a thumbnail as a data: address.
base64 = { workspace = true }
lz4_flex = { workspace = true }
ruzstd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Azimuthal equidistant systems (Equi7's EPSG 27701–27707, ESRI's polar ones) need proj4rs' `aeqd`,
# native only as in rustgis-map: its geodesic routines need libm, which wasm32-unknown-unknown lacks.
proj4rs = { workspace = true, features = ["aeqd"] }
rusqlite = { workspace = true }
postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
mysql = { workspace = true }
tiberius = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# Private temporary workspaces for downloaded JPEG 2000 conversion through GDAL.
tempfile = "3"
# The computer's physical memory, for the limits that scale with it (`memory`, #1291 step 2).
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
# Safe effective-UID and no-follow operations for private Shapefile index caches.
rustix = { version = "1.1", features = ["process", "fs"] }

[dev-dependencies]
# Writing sample GeoParquet files.
parquet = { workspace = true, features = ["arrow"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Writing Zstandard-compressed GeoTIFFs.
zstd = { workspace = true }
