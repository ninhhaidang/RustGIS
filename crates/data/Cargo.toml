[package]
name = "rustgis-data"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "RustGIS L1: feature model, attribute values, vector I/O (GeoJSON, CSV, Shapefile, GeoPackage, GeoParquet, FlatGeobuf, KML/KMZ, GPX), data providers (GeoParquet, FlatGeobuf, GeoPackage) and rasters (GeoTIFF, ASCII grid)"

[lints]
workspace = true

[dependencies]
rustgis-geom = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true, optional = true }
thiserror = { workspace = true }
csv = { workspace = true }
# Streaming gzip text imports; use the pure-Rust backend in the browser too.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
shapefile = { workspace = true }
encoding_rs = { workspace = true }
# Zstandard, the usual compression of COGs, is C code that compiles to WebAssembly with clang
# (on the CI runners), so the browser decodes it too.
tiff = { workspace = true, features = ["zstd"] }
weezl.workspace = true
crs-definitions = { workspace = true }
terrio-crs = { workspace = true }
miniz_oxide = { workspace = true }
roxmltree = { workspace = true }
quick-xml = { workspace = true }
# zstd, the usual compression of GeoParquet, compiles to WebAssembly like the GeoTIFF one above.
parquet = { workspace = true, features = ["zstd"] }
url = { workspace = true }
bytes = { workspace = true }
flatgeobuf = { workspace = true }
# Polygon union: a multipatch's footprint (File Geodatabase).
geo = { workspace = true }
geozero = { workspace = true }
calamine = { workspace = true }
# LAZ (compressed LiDAR) point clouds.
laz = { workspace = true }
# KML ground overlays are PNG or JPEG pictures.
image = { workspace = true, features = ["jpeg"] }
# Geotagged photos keep a thumbnail as a data: address.
base64 = { workspace = true }
lz4_flex = { workspace = true }
ruzstd = { workspace = true }
lerc-reader = { workspace = true }
lerc-core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { workspace = true }
postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
mysql = { workspace = true }
tiberius = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# Native web clients verify servers with the system's trust (see `http`).
# Hashes a source's files, to tell whether they changed since a layer was read (`sync`).
sha2 = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "platform-verifier"] }
# Private temporary workspaces for downloaded JPEG 2000 conversion through GDAL.
tempfile = "3"
# The computer's physical memory, for the limits that scale with it (`memory`, #1291 step 2).
sysinfo = { version = "0.40", default-features = false, features = ["system"] }

# Whether a Linux or BSD system has any CA certificates (see `http`); the platform verifier reads
# the same.
[target.'cfg(all(unix, not(target_vendor = "apple"), not(target_os = "android")))'.dependencies]
rustls-native-certs = "0.8"

[target.'cfg(all(unix, not(target_arch = "wasm32")))'.dependencies]
# Safe effective-UID and no-follow operations for private Shapefile index caches.
rustix = { version = "1.1", features = ["process", "fs"] }

[features]
# The JSON Schema of the saved types (`cargo xtask schema`).
schema = ["dep:schemars", "rustgis-geom/schema"]

[dev-dependencies]
# Writing sample GeoParquet files.
parquet = { workspace = true, features = ["arrow"] }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
proptest = { workspace = true }
# Writing LERC blobs with masks, band sets and padded strips that GDAL never writes.
lerc-writer = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Writing Zstandard-compressed GeoTIFFs.
zstd = { workspace = true }
