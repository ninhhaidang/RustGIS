[package]
name = "rustgis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "rustgis"
description = "RustGIS desktop app"

# #1706: only macos_documents may implement native callbacks. Cargo cannot override an
# inherited `forbid`, so keep the desktop target's other workspace lints in step here.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
rustgis-engine = { workspace = true, features = ["geolibre"] }
rustgis-ui-egui = { workspace = true }
# The ChatGPT sign-in, given the keychain at start-up.
rustgis-assistant = { workspace = true }
rustgis-keychain = { workspace = true }
eframe = { workspace = true, features = ["clipboard", "default_fonts", "links", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

# The Windows exe icon (build.rs). Gated on the host, so other platforms build neither.
[target.'cfg(windows)'.build-dependencies]
tiny-skia = { workspace = true }
embed-resource = "3"

# macOS: reads the native title bar's geometry (window buttons, height) so the header can sit in it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults", "NSObject", "NSNotification", "NSAppleEventDescriptor", "NSAppleEventManager", "NSURL", "NSData", "NSError", "NSArray"] }
# The native menu bar (#1077). Its own unsafe code stays in the crate.
muda = { version = "0.21", default-features = false }
# Turns winit's default menu off: keep the version in step with eframe's, as for Linux below.
winit = { version = "0.30", default-features = false }

# Linux: GNOME on Wayland leaves the title bar to the app. winit draws an Adwaita one (title,
# minimise, maximise, close, following the light/dark theme) instead of its plain grey fallback.
# Only adds the feature to eframe's winit: keep the version in step with eframe's (`cargo tree -i
# winit` lists one winit). A different one would build a second winit and lose the title bar.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd", target_os = "dragonfly"))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
